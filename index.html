<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Second Brain Dashboard</title>
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Dashboard"><meta name="theme-color" content="#0d1117">
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="app">
  <header>
    <div class="logo"><span class="lg">S</span><b>Second Brain</b></div>
    <div class="title glass">Dashboard</div>
    <nav id="nav">
      <button data-v="home" class="on">Home</button>
      <button data-v="bills">Spese</button>
      <button data-v="cars">Auto</button>
      <button data-v="contracts">Contratti</button>
      <button data-v="deadlines">Scadenze</button>
    </nav>
    <div class="sp"></div>
    <button class="btn" id="addBtn">+ Aggiungi</button>
    <button class="mini glass" id="exportMobile" title="Crea la versione per iPhone">Esporta per iPhone</button>
    <button class="round glass" id="openVault" title="Apri archivio">&#128193;</button>
  </header>
  <div id="banner" class="glass banner" hidden>
    <span>Stai vedendo dati di esempio.</span>
    <button id="clearDemo">Rimuovi esempi</button>
  </div>
  <main id="view"></main>
  <footer id="ver"></footer>
</div>
<script src="data.js"></script><script src="app.js"></script><script src="reg.js"></script>
</body>
</html>
